replicaCount: 0

image:
  repository: ghcr.io/mwenkdev/project-zomboid-server-docker
  tag: v0.1.3
  pullPolicy: Always

# The chart does not create a Secret or PVCs. Check the existing data PVC layout
# before enabling the server after migrating from the Indifferent Broccoli image.
existingSecret: ""
persistence:
  serverDataClaim: ""
  workshopCacheClaim: "" # Optional separate PVC for Steam Workshop downloads

config:
  SERVERNAME: pzserver
  MEMORY: 4096m
  PORT: "16261"

# When enabled, these entries own WorkshopItems, Mods and Map in the live INI.
# An empty items list deliberately clears the mod list. Prefer stable Workshop IDs;
# names require a STEAM_WEB_API_KEY in the existing Secret and must match uniquely.
mods:
  enabled: false
  updateOnStart: true # false skips SteamCMD checks for cached items; missing items still download
  items: []
  # - workshopId: "123456789"
  #   name: Friendly label (optional when workshopId is specified)
  #   modIds: [ExactModId] # required when an item contains multiple mod IDs
  #   maps: [] # required when an item contains multiple map folders

service:
  type: NodePort
  gamePort: 16261
  relayPort: 16262
  gameNodePort: null
  relayNodePort: null

resources: {}
nodeSelector: {}
terminationGracePeriodSeconds: 120
