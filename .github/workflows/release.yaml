name: Publish chart

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: chart-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.20.2
      - name: Verify release tag and chart version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(helm show chart . | awk '$1 == "version:" {print $2}')"
          test "$TAG" = "v$version"
          git merge-base --is-ancestor HEAD origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: helm lint . -f ci/values.yaml --strict
      - run: helm template pz-server . --namespace pz -f ci/values.yaml > /dev/null
      - run: helm package . --destination /tmp

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      push_attempted: ${{ steps.attempt.outputs.push_attempted }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.20.2
      - name: Check that OCI version is not already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/user/packages/container/pz-helm")"
          case "$status" in
            404) ;; # First release: package does not exist yet.
            200)
              ids="$(gh api --paginate '/user/packages/container/pz-helm/versions?per_page=100' \
                --jq ".[] | select(.metadata.container.tags[]? == \"$VERSION\") | .id")"
              test -z "$ids" || { echo "OCI version $VERSION already exists" >&2; exit 1; }
              ;;
            *) echo "GHCR preflight returned HTTP $status" >&2; exit 1 ;;
          esac
      - name: Package and log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm package . --destination /tmp
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish OCI chart
        id: attempt
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          echo 'push_attempted=true' >> "$GITHUB_OUTPUT"
          helm push "/tmp/pz-helm-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

  rollback:
    if: ${{ always() && (needs.validate.result == 'failure' || needs.publish.result == 'failure') }}
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Remove newly published OCI version if a push was attempted
        if: ${{ needs.publish.outputs.push_attempted == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate '/user/packages/container/pz-helm/versions?per_page=100' \
            --jq ".[] | select(.metadata.container.tags[]? == \"$VERSION\") | .id")"
          for id in $ids; do
            gh api --method DELETE "/user/packages/container/pz-helm/versions/$id"
          done
      - name: Remove failed GitHub Release (keep tag for retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${TAG#v}"
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/user/packages/container/pz-helm")"
            case "$status" in
              200)
                ids="$(gh api --paginate '/user/packages/container/pz-helm/versions?per_page=100' \
                  --jq ".[] | select(.metadata.container.tags[]? == \"$version\") | .id")"
                if [[ -n "$ids" ]]; then
                  echo "OCI version $version still exists; preserving its GitHub Release" >&2
                  exit 0
                fi
                ;;
              404) ;;
              *) echo "Cannot confirm rollback: GHCR returned HTTP $status" >&2; exit 1 ;;
            esac
          fi
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
