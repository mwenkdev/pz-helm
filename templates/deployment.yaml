{{- if gt (int .Values.replicaCount) 1 -}}
{{- fail "replicaCount must be 0 or 1: multiple servers can corrupt the same world" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pz-helm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "pz-helm.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "pz-helm.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "pz-helm.fullname" . }}
{{- if .Values.mods.enabled }}
      annotations:
        checksum/mods: {{ .Values.mods.items | toJson | sha256sum }}
{{- end }}
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: pz-server
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
{{- if .Values.image.pullPolicy }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "pz-helm.fullname" . }}-config
          env:
            - name: ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: ADMIN_USERNAME
                  optional: true
            - name: ADMIN_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ADMIN_PASSWORD
                  optional: true
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: PASSWORD
            - name: RCONPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: RCON_PASSWORD
{{- if .Values.mods.enabled }}
            - name: MOD_MANIFEST
              value: /server/mods.json
            - name: MOD_UPDATE_ON_START
              value: {{ .Values.mods.updateOnStart | toString | quote }}
            - name: STEAM_WEB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: STEAM_WEB_API_KEY
                  optional: true
{{- end }}
          ports:
            - name: game
              containerPort: {{ .Values.service.gamePort }}
              protocol: UDP
            - name: steam-relay
              containerPort: {{ .Values.service.relayPort }}
              protocol: UDP
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: server-data
              mountPath: /home/steam/Zomboid
{{- if .Values.mods.enabled }}
            - name: mod-manifest
              mountPath: /server/mods.json
              subPath: mods.json
              readOnly: true
{{- if .Values.persistence.workshopCacheClaim }}
            - name: workshop-cache
              mountPath: /home/steam/pz-dedicated/steamapps/workshop
{{- end }}
{{- end }}
      volumes:
        - name: server-data
          persistentVolumeClaim:
            claimName: {{ required "persistence.serverDataClaim is required" .Values.persistence.serverDataClaim }}
{{- if .Values.mods.enabled }}
        - name: mod-manifest
          configMap:
            name: {{ include "pz-helm.fullname" . }}-mods
{{- if .Values.persistence.workshopCacheClaim }}
        - name: workshop-cache
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.workshopCacheClaim | quote }}
{{- end }}
{{- end }}
